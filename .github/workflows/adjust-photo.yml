name: Authentic brand logo SVGs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace drawn icons with authentic brand SVG paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import urllib.request

          p = Path('index.html')
          s = p.read_text()

          brands = {
            'Viber': ('viber', '#7360F2'),
            'WhatsApp': ('whatsapp', '#25D366'),
            'Telegram': ('telegram', '#26A5E4'),
            'Vodafone': ('vodafone', '#E60000'),
          }

          def get_svg(slug, color, label):
              # Simple Icons ships the actual trademark vector path for each brand.
              url = f'https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/{slug}.svg'
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              svg = urllib.request.urlopen(req, timeout=20).read().decode('utf-8')
              svg = re.sub(r'<svg[^>]*>', f'<svg viewBox="0 0 24 24" role="img" aria-label="{label}" style="width:100%;height:100%;display:block;fill:{color}">', svg, count=1)
              svg = svg.replace('fill="currentColor"', '')
              return svg

          for label, (slug, color) in brands.items():
              svg = get_svg(slug, color, label)

              # Replace currently inlined handmade SVG for this label.
              pattern = r'<svg[^>]*aria-label="' + re.escape(label) + r'"[^>]*>.*?</svg>'
              s, n = re.subn(pattern, svg, s, flags=re.S)

              # Fallbacks for any old img/background implementation.
              if n == 0:
                  pattern2 = r'<span class="cssImg" role="img" aria-label="' + re.escape(label) + r'"[^>]*></span>'
                  s = re.sub(pattern2, svg, s)
                  pattern3 = r'<img[^>]*alt="' + re.escape(label) + r'"[^>]*>'
                  s = re.sub(pattern3, svg, s)

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use authentic brand logo vectors [skip ci]' || exit 0
          git push
