name: Mini consultation creates request

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update mini consultation flow
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          s = s.replace(
            'Вона збере ім’я, тип техніки, марку, модель, симптом та код помилки й сформує готове звернення.',
            'Вона збере контактні дані та інформацію про техніку, після чого створить заявку для Андрія.'
          )

          start = s.find('function finish(){')
          end = s.find("document.addEventListener('click'", start)
          if start == -1 or end == -1:
              raise SystemExit('finish() block not found')

          new_finish = '''function finish(){i.disabled=true;c.innerHTML='';let sum=`<b>Перевірте дані заявки ✅</b><br><br>Ім’я: ${esc(s.name)}<br>Телефон: ${esc(s.phone)}<br>Техніка: ${esc(s.machine)}<br>Марка: ${esc(s.brand)}<br>Модель: ${esc(s.model)}<br>Проблема: ${esc(s.issue)}<br>Код помилки: ${esc(s.error)}`;b(sum);trackEvent('service_request',{name:s.name,phone:s.phone,machine:s.machine,brand:s.brand,model:s.model,issue:s.issue,error:s.error});setTimeout(()=>b(`<b>Заявку створено та передано Андрію ✅</b><br>Він зв’яжеться з Вами за номером <b>${esc(s.phone)}</b>. Додатково писати в месенджер не потрібно.`),180)}'''
          s = s[:start] + new_finish + s[end:]

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make mini consultation create service request [skip ci]' || exit 0
          git push
