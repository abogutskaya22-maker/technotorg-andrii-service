name: Adjust hero portrait

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lower portrait to text level
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('.heroCard{min-height:590px;', '.heroCard{min-height:690px;')
          s = s.replace('gap:16px;padding-top:12px}.person{', 'gap:16px;padding-top:110px}.person{')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Lower hero portrait to text level [skip ci]' || exit 0
          git push
