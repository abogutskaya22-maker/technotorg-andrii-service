name: Adjust hero portrait

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild hero layout consistently
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old_card = '.heroCard{min-height:690px;border-radius:34px;padding:48px;color:#fff;display:grid;grid-template-columns:1.18fr .82fr;gap:18px;align-items:center;overflow:hidden;position:relative;background:linear-gradient(100deg,rgba(18,20,24,.97),rgba(28,31,37,.74)),radial-gradient(circle at 82% 22%,rgba(217,24,70,.68),transparent 27%),linear-gradient(135deg,#484d56,#17191e);box-shadow:0 18px 50px rgba(20,20,25,.13)}'
          new_card = '.heroCard{min-height:690px;border-radius:34px;padding:64px 48px 46px;color:#fff;display:grid;grid-template-columns:minmax(0,1.18fr) minmax(280px,.82fr);grid-template-areas:"text visual" "actions actions";column-gap:30px;row-gap:34px;align-content:center;align-items:start;overflow:hidden;position:relative;background:linear-gradient(100deg,rgba(18,20,24,.97),rgba(28,31,37,.74)),radial-gradient(circle at 82% 22%,rgba(217,24,70,.68),transparent 27%),linear-gradient(135deg,#484d56,#17191e);box-shadow:0 18px 50px rgba(20,20,25,.13)}'
          s = s.replace(old_card, new_card)

          s = s.replace('.heroText{position:relative;z-index:3;padding-bottom:8px;transform:translateY(-82px)}', '.heroText{grid-area:text;position:relative;z-index:3;padding-bottom:0;transform:none;align-self:start}')
          s = s.replace('.heroVisual{position:relative;align-self:stretch;min-height:500px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-start;padding-top:0;transform:translateY(70px)}', '.heroVisual{grid-area:visual;position:relative;min-height:0;display:flex;align-items:flex-start;justify-content:flex-end;padding:0;transform:none;align-self:start}')
          s = s.replace('.person{position:relative;right:auto;top:auto;bottom:auto;width:min(360px,86%);max-height:330px;object-fit:contain;object-position:right top;filter:drop-shadow(0 16px 26px rgba(0,0,0,.28));z-index:1;flex:0 0 auto}', '.person{position:relative;width:min(360px,92%);max-height:330px;object-fit:contain;object-position:right top;filter:drop-shadow(0 16px 26px rgba(0,0,0,.28));z-index:1;display:block}')
          s = s.replace('.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.actions .btn{min-height:48px}.actions .quick{padding-inline:18px}', '.heroActions{grid-area:actions;display:flex;flex-wrap:wrap;gap:10px;margin:0;align-items:center}.heroActions .btn{min-height:48px}.heroActions .quick{padding-inline:18px}')

          old_media_850 = '@media(max-width:850px){.heroCard{grid-template-columns:1fr;min-height:820px;padding:36px 28px;align-items:start}.heroText{transform:translateY(-28px)}.heroVisual{min-height:auto;padding-top:0;align-items:flex-end;transform:translateY(2px)}.person{right:auto;top:auto;bottom:auto;width:min(340px,56vw);max-height:330px}.consult,.about,.contact{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}'
          new_media_850 = '@media(max-width:850px){.heroCard{grid-template-columns:minmax(0,1.15fr) minmax(220px,.85fr);grid-template-areas:"text visual" "actions actions";min-height:610px;padding:52px 30px 36px;column-gap:20px;row-gap:28px;align-content:center}.heroText{transform:none}.heroVisual{min-height:0;padding:0;transform:none;align-items:flex-start;justify-content:flex-end}.person{width:min(320px,100%);max-height:310px}.consult,.about,.contact{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}'
          s = s.replace(old_media_850, new_media_850)

          old_media_600 = '@media(max-width:600px){nav{height:62px}.logo{font-size:18px}.mark{width:36px;height:36px;border-width:3px}.hero{padding-top:17px}.heroCard{padding:27px 19px;min-height:auto;border-radius:25px;gap:22px}.heroText{transform:translateY(-18px)}.heroVisual{min-height:auto;padding-top:0;transform:translateY(2px)}.person{right:auto;top:auto;bottom:auto;width:52vw;max-width:260px;max-height:none;align-self:flex-end}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .btn:first-child{grid-column:1/-1}.actions .quick{grid-column:1/-1}.grid,.stats{grid-template-columns:1fr}.mobile{display:flex}.contact{padding:26px 19px}}'
          new_media_600 = '@media(max-width:600px){nav{height:62px}.logo{font-size:18px}.mark{width:36px;height:36px;border-width:3px}.hero{padding-top:17px}.heroCard{grid-template-columns:minmax(0,1.18fr) minmax(118px,.82fr);grid-template-areas:"text visual" "actions actions";padding:38px 18px 28px;min-height:520px;border-radius:25px;column-gap:12px;row-gap:24px;align-content:center}.heroText{transform:none;align-self:start}.heroVisual{min-height:0;padding:0;transform:none;align-self:start;justify-content:flex-end}.person{width:100%;max-width:220px;max-height:270px;align-self:flex-start}.heroText h1{font-size:clamp(42px,12vw,58px);margin:10px 0 14px}.heroText .sub{font-size:clamp(17px,4.8vw,21px);line-height:1.15}.heroText .copy{font-size:13px;line-height:1.45;margin-top:14px}.heroText .ey{font-size:10px}.heroActions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.heroActions .btn{min-height:44px;padding:11px 9px;font-size:13px}.heroActions .quick{grid-column:1/-1}.grid,.stats{grid-template-columns:1fr}.mobile{display:flex}.contact{padding:26px 19px}}'
          s = s.replace(old_media_600, new_media_600)

          old_hero = '<div class="heroText"><div class="ey">Сервіс, який поруч</div><h1>Андрій</h1><div class="sub">Сервісний інженер «Техноторг»</div><p class="copy">Консультація, діагностика, налаштування та сервіс сільськогосподарської техніки. Опишіть проблему — допоможу визначити наступний крок.</p><div class="actions"><a class="btn red" href="tel:+380665628743">📞 Подзвонити</a><a class="btn light" href="viber://chat?number=%2B380665628743">💬 Viber</a><a class="btn light" href="https://wa.me/380665628743">🟢 WhatsApp</a><a class="btn light" href="tg://resolve?phone=380665628743">✈️ Telegram</a><a class="btn outline quick" href="#consult">🤖 Міні-консультація</a></div></div><div class="heroVisual"><img class="person" src="andrii-cutout.png" alt="Андрій, сервісний інженер Техноторг"></div>'
          new_hero = '<div class="heroText"><div class="ey">Сервіс, який поруч</div><h1>Андрій</h1><div class="sub">Сервісний інженер «Техноторг»</div><p class="copy">Консультація, діагностика, налаштування та сервіс сільськогосподарської техніки. Опишіть проблему — допоможу визначити наступний крок.</p></div><div class="heroVisual"><img class="person" src="andrii-cutout.png" alt="Андрій, сервісний інженер Техноторг"></div><div class="heroActions"><a class="btn red" href="tel:+380665628743">📞 Подзвонити</a><a class="btn light" href="viber://chat?number=%2B380665628743">💬 Viber</a><a class="btn light" href="https://wa.me/380665628743">🟢 WhatsApp</a><a class="btn light" href="tg://resolve?phone=380665628743">✈️ Telegram</a><a class="btn outline quick" href="#consult">🤖 Міні-консультація</a></div>'
          s = s.replace(old_hero, new_hero)

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Unify hero layout across desktop and mobile [skip ci]' || exit 0
          git push
