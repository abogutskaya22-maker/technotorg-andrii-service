name: Restore Technotorg header logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore official logo in header
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          logo = 'data:image/png;base64,'

          new_header = f'<a class="logo" href="https://technotorg.com" target="_blank" rel="noopener" aria-label="Техноторг"><img src="{logo}" alt="Техноторг"></a>'
          s, n = re.subn(r'<a class="logo" href="https://technotorg\.com"[^>]*><img src="data:image/png;base64,[^"]+" alt="Техноторг"></a>', new_header, s, count=1)
          if n != 1:
              raise SystemExit('Header logo block not found')

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore official Technotorg header logo [skip ci]' || exit 0
          git push
