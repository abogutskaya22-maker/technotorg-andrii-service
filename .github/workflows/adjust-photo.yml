name: Refine assistant and messenger icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update assistant name and messenger branding
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          # Female assistant name.
          s = s.replace('Макс', 'Мія')
          s = s.replace('Він збере ім’я, тип техніки, марку, модель, симптом та код помилки й сформує готове звернення.', 'Вона збере ім’я, тип техніки, марку, модель, симптом та код помилки й сформує готове звернення.')

          # Use recognizable messenger brand marks from Simple Icons.
          s = s.replace('.brandIcon svg{width:100%;height:100%;display:block}', '.brandIcon img{width:100%;height:100%;display:block;object-fit:contain}')

          icons = {
              'Viber': '<span class="brandIcon"><img src="https://cdn.simpleicons.org/viber/7360F2" alt=""></span>',
              'WhatsApp': '<span class="brandIcon"><img src="https://cdn.simpleicons.org/whatsapp/25D366" alt=""></span>',
              'Telegram': '<span class="brandIcon"><img src="https://cdn.simpleicons.org/telegram/26A5E4" alt=""></span>',
          }

          # Replace all existing hand-drawn messenger SVG spans by matching the label that follows them.
          for label, icon in icons.items():
              pattern = rf'<span class="brandIcon"><svg.*?</svg></span>{label}'
              s = re.sub(pattern, icon + label, s, flags=re.S)

          # Add icons to contact section messenger rows if not already present.
          s = s.replace('<a href="viber://chat?number=%2B380665628743"><span>Viber</span><span>→</span></a>', f'<a href="viber://chat?number=%2B380665628743"><span style="display:flex;align-items:center;gap:10px">{icons["Viber"]}Viber</span><span>→</span></a>')
          s = s.replace('<a href="https://wa.me/380665628743"><span>WhatsApp</span><span>→</span></a>', f'<a href="https://wa.me/380665628743"><span style="display:flex;align-items:center;gap:10px">{icons["WhatsApp"]}WhatsApp</span><span>→</span></a>')
          s = s.replace('<a href="tg://resolve?phone=380665628743"><span>Telegram</span><span>→</span></a>', f'<a href="tg://resolve?phone=380665628743"><span style="display:flex;align-items:center;gap:10px">{icons["Telegram"]}Telegram</span><span>→</span></a>')

          # Add messenger icons to the final mini-consultation send choices.
          old_send = 'c.innerHTML=`<div class="sendChoices"><a class="btn light" target="_blank" href="${WA}?text=${txt}">WhatsApp</a><button class="btn light" type="button" onclick="copyAndOpen(VIBER)">Viber</button><button class="btn light" type="button" onclick="copyAndOpen(TG)">Telegram</button></div>`'
          new_send = f'c.innerHTML=`<div class="sendChoices"><a class="btn light" target="_blank" href="${{WA}}?text=${{txt}}">{icons["WhatsApp"]}WhatsApp</a><button class="btn light" type="button" onclick="copyAndOpen(VIBER)">{icons["Viber"]}Viber</button><button class="btn light" type="button" onclick="copyAndOpen(TG)">{icons["Telegram"]}Telegram</button></div>`'
          s = s.replace(old_send, new_send)

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rename assistant to Mia and refine messenger icons [skip ci]' || exit 0
          git push
