name: Adjust hero portrait

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lower portrait slightly
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('gap:16px;padding-top:0;transform:translateY(-82px)', 'gap:16px;padding-top:0;transform:translateY(-22px)')
          s = s.replace('align-items:flex-end;transform:translateY(-28px)}.person{', 'align-items:flex-end;transform:translateY(2px)}.person{')
          s = s.replace('gap:14px;transform:translateY(-18px)}.person{', 'gap:14px;transform:translateY(2px)}.person{')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Lower hero portrait slightly [skip ci]' || exit 0
          git push
