name: Refine contact block

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update contact CTA and Technotorg brand mark
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          s = s.replace(
              '<button type="button" onclick="openSheet(\'callSheet\')"><span>📞 Обрати номер для дзвінка</span><span>→</span></button>',
              '<button type="button" onclick="openSheet(\'callSheet\')"><span>📞 Подзвонити</span><span>→</span></button>'
          )

          logo = 'data:image/png;base64,'
          old = '<a href="https://technotorg.com"><span class="contactLabel"><span class="brandIcon"><img src="https://technotorg.com/favicon.ico" alt="Техноторг"></span>technotorg.com</span><span>↗</span></a>'
          new = f'<a href="https://technotorg.com" target="_blank" rel="noopener"><span class="contactLabel"><span class="brandIcon"><img src="{logo}" alt="Техноторг"></span>Техноторг</span><span>↗</span></a>'
          s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine contact button and Technotorg link [skip ci]' || exit 0
          git push
