name: Opera-safe visual rendering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render visuals without img elements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          # Opera/ad blockers can cosmetically hide IMG elements after first paint.
          # Move the important visuals to CSS backgrounds so they remain visible.
          if '.cssImg{' not in s:
              s = s.replace('</style>', '.cssImg{display:inline-block;background-repeat:no-repeat;background-position:center;background-size:contain}.person.cssImg{position:absolute;right:0;bottom:0;width:min(430px,108%);height:100%;max-height:116%;background-position:right bottom;filter:drop-shadow(0 16px 26px rgba(0,0,0,.28));z-index:1}.logo .cssImg{height:48px;width:240px;max-width:240px}.brandIcon .cssImg{width:100%;height:100%}@media(max-width:850px){.person.cssImg{width:min(370px,112%)}}@media(max-width:600px){.logo .cssImg{height:38px;width:190px;max-width:190px}.person.cssImg{width:118%;max-width:260px}}' + '</style>', 1)

          # Hero photo -> div background-image.
          s = re.sub(
              r'<img class="person" src="(data:image/[^\"]+)" alt="Андрій, сервісний інженер Техноторг">',
              lambda m: '<div class="person cssImg" role="img" aria-label="Андрій, сервісний інженер Техноторг" style="background-image:url(\'' + m.group(1) + '\')"></div>',
              s,
              count=1
          )

          # Header Technotorg logo -> CSS background.
          s = re.sub(
              r'<img src="(data:image/[^\"]+)" alt="Техноторг">',
              lambda m: '<span class="cssImg" role="img" aria-label="Техноторг" style="background-image:url(\'' + m.group(1) + '\')"></span>',
              s,
              count=1
          )

          # All inline brand icons -> CSS backgrounds instead of IMG.
          s = re.sub(
              r'<img src="(data:image/[^\"]+)" alt="([^\"]+)">',
              lambda m: '<span class="cssImg" role="img" aria-label="' + m.group(2) + '" style="background-image:url(\'' + m.group(1) + '\')"></span>',
              s
          )

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Render visual assets as CSS backgrounds for Opera [skip ci]' || exit 0
          git push
