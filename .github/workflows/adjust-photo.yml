name: Fix call popup and request button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  fix-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair button JavaScript and rename consultation CTA
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          # Fix the JavaScript parse error that prevents all onclick handlers from loading.
          s = s.replace("trackEvent('page_view',{})const ICONS=", "trackEvent('page_view',{});const ICONS=", 1)

          # Rename the primary consultation CTA while keeping the existing AI-chat handler.
          s = s.replace('>🤖 Міні-консультація</button>', '>🤖 Залишити заявку</button>')
          s = s.replace('>🤖 Відкрити міні-консультацію</button>', '>🤖 Залишити заявку</button>')

          # Keep the mobile bottom action consistent.
          s = s.replace('<span>🤖</span>Консультація</button>', '<span>🤖</span>Заявка</button>')

          if "trackEvent('page_view',{})const ICONS=" in s:
              raise SystemExit('JavaScript parse error is still present')
          if '>🤖 Міні-консультація</button>' in s:
              raise SystemExit('Primary CTA rename did not apply')
          if "onclick=\"openSheet('callSheet')\"" not in s:
              raise SystemExit('Call-sheet handler missing')
          if 'id="callSheet"' not in s or 'tel:+380665628743' not in s or 'tel:+380969897456' not in s:
              raise SystemExit('Two-number call sheet is incomplete')
          if 'onclick="openConsult()"' not in s:
              raise SystemExit('AI consultation handler missing')

          p.write_text(s)
          PY
      - name: Commit repaired page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Repair call popup and AI request button [skip ci]' || exit 0
          git push
