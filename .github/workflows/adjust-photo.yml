name: Fix desktop interactions and hero photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix JavaScript and refresh photo asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          # Fix syntax error that stopped all JS-driven buttons on desktop.
          s = s.replace("trackEvent('page_view',{})const ICONS=", "trackEvent('page_view',{});const ICONS=", 1)

          # Bust stale desktop cache for the engineer photo while keeping the same asset.
          s = s.replace('src="andrii-cutout.png" alt="Андрій, сервісний інженер Техноторг"', 'src="/andrii-cutout.png?v=20260912-1" alt="Андрій, сервісний інженер Техноторг"', 1)

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix desktop buttons and refresh hero photo [skip ci]' || exit 0
          git push
