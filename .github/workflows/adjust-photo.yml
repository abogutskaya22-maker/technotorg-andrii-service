name: Use official Technotorg header logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace CSS-built header logo with official brand asset
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          logo = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAbkAAAB2CAYAAABVne39AAAL70lEQVR4nO3d25HiOB+HYbG1ARACEVBU0QHMZQfBNWRAEJ1Bc00Qc9kBDFUUERACGXgv2tp1s1jWX2fJ71P11Tc7PY2ND/pZsg6LrusUAAAt+iv3DgAAEAshBwBoFiEHAGgWIQcAaBYhBwBo1j/4bnTNtl2cKAAAAABJRU5ErkJggg=='

          # Use the actual Technotorg logo instead of text + a CSS-built circle.
          s = s.replace(
              '.logo{display:flex;align-items:center;gap:14px;color:var(--r);font-weight:900;font-size:23px}.mark{width:44px;height:44px;border:4px solid var(--r);border-radius:50%;display:grid;place-items:center;font-size:24px}',
              '.logo{display:flex;align-items:center}.logo img{display:block;height:48px;width:auto;max-width:240px;object-fit:contain}'
          )
          s = s.replace(
              '<div class="logo"><span>ТЕХНОТОРГ</span><span class="mark">Т</span></div>',
              f'<a class="logo" href="https://technotorg.com" target="_blank" rel="noopener" aria-label="Техноторг"><img src="{logo}" alt="Техноторг"></a>'
          )
          s = s.replace(
              '.logo{font-size:18px}.mark{width:36px;height:36px;border-width:3px}',
              '.logo img{height:38px;max-width:190px}'
          )

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use official Technotorg header logo [skip ci]' || exit 0
          git push
