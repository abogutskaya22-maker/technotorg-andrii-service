name: Deploy linked analytics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark analytics version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '<!-- lead-linked-analytics-v2 -->'
          if marker not in s:
              s = s.replace('</body>', marker + '</body>', 1)
              p.write_text(s)
          PY
      - name: Commit production trigger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Deploy lead-linked analytics v2' || exit 0
          git push
