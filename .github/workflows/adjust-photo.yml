name: Fix analytics lead fields

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Include lead name and phone in completed consultation analytics
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old = "trackEvent('consultation_completed',{machine:s.machine,brand:s.brand,model:s.model,issue:s.issue,error:s.error})"
          new = "trackEvent('consultation_completed',{name:s.name,phone:s.phone,machine:s.machine,brand:s.brand,model:s.model,issue:s.issue,error:s.error})"

          if old not in s:
              raise SystemExit('analytics payload target not found')

          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Include lead name and phone in analytics [skip ci]' || exit 0
          git push
