name: Refine assistant chat

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename assistant and lock chat height
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          # Assistant name.
          s = s.replace('Олена', 'Анна')
          s = s.replace('Мія', 'Анна')
          s = s.replace('Макс', 'Анна')

          # Keep the chat at a fixed height and scroll messages inside it.
          s = s.replace(
              '.chat{background:#fff;border:1px solid var(--l);border-radius:28px;overflow:hidden;min-height:500px;display:flex;flex-direction:column}',
              '.chat{background:#fff;border:1px solid var(--l);border-radius:28px;overflow:hidden;height:500px;min-height:0;max-height:500px;display:flex;flex-direction:column}'
          )
          s = s.replace(
              '.msgs{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}',
              '.msgs{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}'
          )
          s = s.replace(
              '.chat{min-height:470px}',
              '.chat{height:470px;min-height:0;max-height:470px}'
          )

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rename assistant to Anna and make chat scrollable [skip ci]' || exit 0
          git push
