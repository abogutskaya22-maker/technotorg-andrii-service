name: Inline SVG brand icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace blocked brand assets with inline SVG
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          icons = {
            'Viber': '''<svg viewBox="0 0 32 32" role="img" aria-label="Viber" style="width:100%;height:100%;display:block"><circle cx="16" cy="16" r="15" fill="#7360F2"/><path d="M10.2 9.4c.5-.5 1.4-.4 1.8.2l1.7 2.5c.4.6.3 1.3-.2 1.8l-1.1 1c1.1 2.3 2.9 4.1 5.2 5.2l1-1.1c.5-.5 1.2-.6 1.8-.2l2.5 1.7c.6.4.7 1.3.2 1.8l-1.2 1.2c-.9.9-2.3 1.2-3.5.8-6.2-1.9-10.7-6.4-12.6-12.6-.4-1.2-.1-2.6.8-3.5l1.2-1.2z" fill="#fff" transform="translate(1 1) scale(.9)"/><path d="M18 8.4c3 .5 5.2 2.7 5.7 5.7M17.5 11.2c1.7.3 2.9 1.5 3.2 3.2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>''',
            'WhatsApp': '''<svg viewBox="0 0 32 32" role="img" aria-label="WhatsApp" style="width:100%;height:100%;display:block"><circle cx="16" cy="16" r="15" fill="#25D366"/><path d="M9.7 24.1l1.1-4a9 9 0 1 1 3.4 3.3l-4.5.7z" fill="#fff"/><path d="M13 11.1c.3-.4.6-.4.9-.4h.7c.2 0 .5.1.6.5l1 2.3c.1.3.1.6-.1.8l-.8 1c-.2.2-.2.5 0 .8.8 1.5 2 2.7 3.5 3.5.3.2.6.1.8-.1l1-1.1c.2-.3.5-.3.8-.2l2.2 1.1c.3.2.5.4.5.7 0 .7-.4 1.6-1 2.1-.6.6-1.5 1-2.7 1-2.2 0-5.1-1.4-7.4-3.7-2.2-2.2-3.7-5-3.7-7.2 0-1.1.4-2.1 1.1-2.8.2-.1.4-.2.6-.3z" fill="#25D366" transform="scale(.82) translate(3.5 3.8)"/></svg>''',
            'Telegram': '''<svg viewBox="0 0 32 32" role="img" aria-label="Telegram" style="width:100%;height:100%;display:block"><circle cx="16" cy="16" r="15" fill="#26A5E4"/><path d="M7.5 15.4l16.8-6.5c.8-.3 1.5.2 1.2 1.4l-2.9 13.5c-.2 1-.8 1.2-1.6.7l-4.4-3.3-2.1 2c-.2.2-.4.4-.8.4l.3-4.5 8.2-7.4c.4-.3-.1-.5-.5-.2l-10.1 6.4-4.4-1.4c-1-.3-1-1 .3-1.5z" fill="#fff"/></svg>''',
            'Vodafone': '''<svg viewBox="0 0 32 32" role="img" aria-label="Vodafone" style="width:100%;height:100%;display:block"><circle cx="16" cy="16" r="15" fill="#E60000"/><path d="M16 7.1c4.9 0 8.9 3.8 8.9 8.7 0 5-4 9.1-9 9.1-4.8 0-8.8-3.8-8.8-8.7 0-4.5 3.3-8.2 7.7-8.8-1.6 1-2.6 2.8-2.6 4.8 0 3.2 2.5 5.7 5.7 5.7 3.1 0 5.6-2.5 5.6-5.6 0-1.5-.6-2.9-1.6-3.9-1.6-.8-3.5-1.3-5.9-1.3z" fill="#fff"/></svg>'''
          }

          for label, svg in icons.items():
              # Replace our CSS-background icon spans, wherever they appear in HTML or JS strings.
              pattern = r'<span class="cssImg" role="img" aria-label="' + re.escape(label) + r'" style="background-image:url\([^>]*?</span>'
              s = re.sub(pattern, svg, s)

              # Fallback: replace any remaining img-based version.
              pattern2 = r'<img[^>]*alt="' + re.escape(label) + r'"[^>]*>'
              s = re.sub(pattern2, svg, s)

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use inline SVG brand icons for Opera [skip ci]' || exit 0
          git push
