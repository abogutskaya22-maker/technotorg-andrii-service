name: Prefill consultation messages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adjust-photo.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send consultation text directly to messenger
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old = "async function copyAndOpen(url){const t=rawSummary();try{await navigator.clipboard.writeText(t);b('Текст звернення скопійовано ✅ Вставте його у відкритий чат.')}catch(e){b('Відкриваю месенджер. Скопіюйте підсумок вище та надішліть Андрію.')}setTimeout(()=>location.href=url,250)}function finish(){i.disabled=true;let sum=`<b>Готово, ${esc(s.name)} ✅</b><br><br>Техніка: ${esc(s.machine)}<br>Марка: ${esc(s.brand)}<br>Модель: ${esc(s.model)}<br>Проблема: ${esc(s.issue)}<br>Код: ${esc(s.error)}<br><br>Куди зручніше надіслати звернення?`;b(sum);let txt=encodeURIComponent(rawSummary());c.innerHTML=`<div class=\"sendChoices\"><a class=\"btn light\" target=\"_blank\" href=\"${WA}?text=${txt}\">${ICONS.whatsapp}WhatsApp</a><button class=\"btn light\" type=\"button\" onclick=\"copyAndOpen(VIBER)\">${ICONS.viber}Viber</button><button class=\"btn light\" type=\"button\" onclick=\"copyAndOpen(TG)\">${ICONS.telegram}Telegram</button></div>`}"

          new = "function finish(){i.disabled=true;let sum=`<b>Готово, ${esc(s.name)} ✅</b><br><br>Техніка: ${esc(s.machine)}<br>Марка: ${esc(s.brand)}<br>Модель: ${esc(s.model)}<br>Проблема: ${esc(s.issue)}<br>Код: ${esc(s.error)}<br><br>Куди зручніше надіслати звернення?`;b(sum);let txt=encodeURIComponent(rawSummary());let viberShare=`viber://forward?text=${txt}`;let telegramShare=`https://t.me/share/url?url=&text=${txt}`;c.innerHTML=`<div class=\"sendChoices\"><a class=\"btn light\" target=\"_blank\" href=\"${WA}?text=${txt}\">${ICONS.whatsapp}WhatsApp</a><a class=\"btn light\" href=\"${viberShare}\">${ICONS.viber}Viber</a><a class=\"btn light\" target=\"_blank\" href=\"${telegramShare}\">${ICONS.telegram}Telegram</a></div>`}"

          if old not in s:
              raise SystemExit('Target block not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Prefill consultation text in messengers [skip ci]' || exit 0
          git push
